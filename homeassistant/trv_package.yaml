    - name: "TRV4 target"
      unique_id: trv4_target
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV4'] if value_json.ZbReceived is defined and 'TRV4' in value_json.ZbReceived else none %}
        {{ d.OccupiedHeatingSetpoint if d and d.OccupiedHeatingSetpoint is defined else this.state }}
      unit_of_measurement: "°C"
      device_class: temperature

  binary_sensor:
    - name: "TRV1 heating"
      unique_id: trv1_heating
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
        {% if d and d.Heating is defined %}{{ 'ON' if d.Heating == 1 else 'OFF' }}{% else %}{{ this.state | upper if this.state in ['on','off'] else 'OFF' }}{% endif %}
      device_class: heat

    - name: "TRV1 battery low"
      unique_id: trv1_battery_low
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
