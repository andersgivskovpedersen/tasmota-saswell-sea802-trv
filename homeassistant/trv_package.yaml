        {% if d and d.BatteryLow is defined %}{{ 'ON' if d.BatteryLow == 1 else 'OFF' }}{% else %}{{ this.state | upper if this.state in ['on','off'] else 'OFF' }}{% endif %}
      device_class: battery

  switch:
    - name: "TRV1 schedule"
      unique_id: trv1_schedule
      command_topic: "cmnd/tasmota_XXXXXX/ZbSend"
      payload_on: '{"Device":"TRV1","Write":{"EF00/016C":1}}'
      payload_off: '{"Device":"TRV1","Write":{"EF00/016C":0}}'
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
        {% if d and d.ScheduleEnabled is defined %}{{ 'ON' if d.ScheduleEnabled == 1 else 'OFF' }}{% else %}{{ this.state | upper if this.state in ['on','off'] else 'OFF' }}{% endif %}
      state_on: "ON"
      state_off: "OFF"
      icon: mdi:calendar-clock

    - name: "TRV2 schedule"
      unique_id: trv2_schedule
      command_topic: "cmnd/tasmota_XXXXXX/ZbSend"
      payload_on: '{"Device":"TRV2","Write":{"EF00/016C":1}}'
      payload_off: '{"Device":"TRV2","Write":{"EF00/016C":0}}'
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV2'] if value_json.ZbReceived is defined and 'TRV2' in value_json.ZbReceived else none %}
        {% if d and d.ScheduleEnabled is defined %}{{ 'ON' if d.ScheduleEnabled == 1 else 'OFF' }}{% else %}{{ this.state | upper if this.state in ['on','off'] else 'OFF' }}{% endif %}
      state_on: "ON"
