# Saswell SEA802 radiator valves (Tuya TS0601) via a Tasmota Zigbee gateway
# Home Assistant package. See README.md. Reverse-engineered, use at your own risk.
#
# Setup:
#   1. configuration.yaml must contain:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to /config/packages/
#   3. Replace tasmota_XXXXXX with your gateway's MQTT topic (search and replace)
#   4. Name the valves on the gateway and report by name:
#        ZbName 0x1234,TRV1      (one line per valve, addresses from ZbInfo)
#        SetOption83 1
#      If you use other names, replace TRV1-TRV4 below.
#      For more or fewer valves, copy or delete the blocks per valve.
#   5. Restart Home Assistant
#
# Requires the Tasmota plugin tuya_trv.zb (names: LocalTemperature, OccupiedHeatingSetpoint,
# Heating, ScheduleEnabled, BatteryLow).
# Target is written to EF00/0267 (Tuya DP 103) as degrees C x 10.
# Schedule switch = DP 108 (EF00/016C): on = follow built-in schedule, off = manual.
# Battery low (DP 105) is unverified.

mqtt:
  sensor:
    - name: "TRV1 temperature"
      unique_id: trv1_temperature
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
        {{ d.LocalTemperature if d and d.LocalTemperature is defined else this.state }}
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
    - name: "TRV1 target"
      unique_id: trv1_target
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
        {{ d.OccupiedHeatingSetpoint if d and d.OccupiedHeatingSetpoint is defined else this.state }}
      unit_of_measurement: "°C"
      device_class: temperature

    - name: "TRV2 temperature"
