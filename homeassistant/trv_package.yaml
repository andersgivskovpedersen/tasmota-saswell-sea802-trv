  number:
    - name: "TRV1 set target"
      unique_id: trv1_set_target
      command_topic: "cmnd/tasmota_XXXXXX/ZbSend"
      command_template: >-
        {"Device":"TRV1","Write":{"EF00/0267":{{ (value * 10) | round | int }}}}
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV1'] if value_json.ZbReceived is defined and 'TRV1' in value_json.ZbReceived else none %}
        {{ d.OccupiedHeatingSetpoint if d and d.OccupiedHeatingSetpoint is defined else this.state }}
      min: 5
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    - name: "TRV2 set target"
      unique_id: trv2_set_target
      command_topic: "cmnd/tasmota_XXXXXX/ZbSend"
