        {{ d.OccupiedHeatingSetpoint if d and d.OccupiedHeatingSetpoint is defined else this.state }}
      unit_of_measurement: "°C"
      device_class: temperature

    - name: "TRV4 temperature"
      unique_id: trv4_temperature
      state_topic: "tele/tasmota_XXXXXX/SENSOR"
      value_template: >-
        {% set d = value_json.ZbReceived['TRV4'] if value_json.ZbReceived is defined and 'TRV4' in value_json.ZbReceived else none %}
